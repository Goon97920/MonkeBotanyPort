- type: entity
  parent: SolutionLarge
  abstract: true
  id: BaseHydroponicsSoil
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.1"
        density: 190
        hard: false
        mask:
        - FullTileMask
        layer:
        - FullTileMask
  - type: Sprite
    noRot: true
  - type: PlantTray
    drawWarnings: false
  - type: Solution
    id: soil
    solution:
      maxVol: 60 # Monkestation plant_growing max_reagents for trays
  - type: RefillableSolution
    solution: soil
    maxRefill: 50
  - type: Transform
    anchored: true
  - type: Reactive
    reactions:
    - reagents: [Water]
      methods: [Touch, Ingestion, Injection]
      effects:
      - !type:AddReagentToSolution
        reagent: Water
        solution: soil
  - type: Appearance

- type: entity
  parent: [ BaseHydroponicsSoil, StructureHealthContainer ]
  id: HydroponicsSoil
  name: soil
  description: A mix of organic matter and minerals creating a soil to grow your plant in space. Seems to be dry.
  components:
  - type: Damageable
    damageModifierSet: RockMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
  - type: Sprite
    sprite: Structures/Hydroponics/misc.rsi
    layers:
    - state: soil
    - sprite: Objects/Specific/Hydroponics/wheat.rsi
      state: stage-1
      map: [ "enum.PlantTrayLayers.Plant" ]
      visible: false

- type: entity
  parent: HydroponicsSoil
  id: FungalSoil
  name: fungal soil
  description: A mix of organic matter and fungal root creating a soil to grow your plant in space. Seems to be dry.
  components:
  - type: Construction
    graph: Soil
    node: fungalSoil
  - type: Sprite
    sprite: Structures/Hydroponics/misc.rsi
    layers:
    - state: fungal_soil
    - sprite: Objects/Specific/Hydroponics/wheat.rsi
      state: stage-1
      map: [ "enum.PlantTrayLayers.Plant" ]
      visible: false
    noRot: true
  - type: PlantTray
    waterPercent: 0
