- type: reagent
  id: RobustHarvest
  name: reagent-name-robust-harvest
  group: Botanical
  desc: reagent-desc-robust-harvest
  flavor: bitter
  color: "#3e901c"
  physicalDesc: reagent-physical-desc-robust
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: -2
            Blunt: -3
            Slash: -3
            Piercing: -3
        conditions:
        - !type:MetabolizerTypeCondition
          type: [Plant]
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [Plant]
        - !type:ReagentCondition
          reagent: RobustHarvest
          min: 30
        damage:
          types:
            Asphyxiation: 1
            Heat: 2
            Poison: 1
      - !type:Polymorph
        prototype: TreeMorph
        conditions:
          - !type:MetabolizerTypeCondition
            type: [Plant]
          - !type:ReagentCondition
            reagent: RobustHarvest
            min: 80
  plantMetabolism:
    - !type:PlantAdjustStat
      stat: Yield
      perUnit: 0.35
    - !type:PlantAdjustStat
      stat: Maturation
      perUnit: 0.1
    - !type:PlantAdjustStat
      stat: Production
      perUnit: 0.05

