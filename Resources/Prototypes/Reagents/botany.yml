- type: reagent
  id: Ammonia
  name: reagent-name-ammonia
  group: Botanical
  desc: reagent-desc-ammonia
  physicalDesc: reagent-physical-desc-pungent
  flavor: bitter
  color: "#77b58e"
  boilingPoint: -33.0
  meltingPoint: -77.7
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Caustic: 1
    Respiration:
      effects:
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Rat ]
          inverted: true
        - !type:ReagentCondition
          reagent: Ammonia
          min: 1
        ignoreResistances: true
        scaling: true
        damage:
          types:
            Poison: 1
      - !type:Vomit
        probability: 0.12
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Rat, Vox ]
          inverted: true
        - !type:ReagentCondition
          reagent: Ammonia
          min: 0.8
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages: [ "ammonia-smell" ]
        probability: 0.1
        conditions:
        - !type:ReagentCondition
          reagent: Ammonia
          min: 0.25
      - !type:EvenHealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Rat ]
        - !type:ReagentCondition
          reagent: Ammonia
          min: 1
        ignoreResistances: true
        damage:
          Brute: -2.5
          Burn: -2.5
          Airloss: -5
      - !type:ModifyBloodLevel
        amount: 1
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Rat ]
        - !type:ReagentCondition
          reagent: Ammonia
          min: 1
      - !type:Oxygenate # ammonia displaces nitrogen in vox blood
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Vox ]
        factor: -4
  plantMetabolism:
    - !type:PlantAdjustHealth
      perUnit: 0.12
    - !type:PlantAdjustStat
      stat: Maturation
      perUnit: 0.2
    - !type:PlantAdjustStat
      stat: Production
      perUnit: 0.1
    - !type:PlantAdjustStat
      stat: Yield
      flatMin: 1
      flatMax: 1
      probability: 0.1

