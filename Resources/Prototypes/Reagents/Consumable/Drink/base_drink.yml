- type: reagent
  id: BaseDrink
  group: Drinks
  abstract: true
  slipData:
    requiredSlipSpeed: 3.5
  metabolisms:
    Digestion:
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 3
  reactiveEffects:
    Extinguish:
      methods: [ Touch ]
      effects:
      - !type:Extinguish
  tileReactions:
  - !type:ExtinguishTileReaction { }
  - !type:SpillIfPuddlePresentTileReaction { }

- type: reagent
  id: BaseSoda
  parent: BaseDrink
  abstract: true
  metabolisms:
    Digestion:
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 2
  footstepSound:
    collection: FootstepSlime
  fizziness: 0.5

- type: reagent
  id: BaseAlcohol
  group: Drinks
  abstract: true
  slipData:
    requiredSlipSpeed: 3.5
  friction: 0.4
  metabolisms:
    Digestion:
      metabolites:
        Ethanol: 0.12
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 2
  reactiveEffects:
    Flammable:
      methods: [ Touch ]
      effects:
      - !type:Flammable
  tileReactions:
  - !type:FlammableTileReaction
    temperatureMultiplier: 1.35
  plantMetabolism:
    - !type:PlantTrainTrait
      trait: AutoDistilling
      perUnit: 0.25
      flat: 3

- type: reagent
  id: BaseJuice
  parent: BaseDrink
  abstract: true
  flavor: sweet
  footstepSound:
    collection: FootstepSlime
