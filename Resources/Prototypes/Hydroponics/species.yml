# Plant species. Stats, traits and mutations follow Monkestation (code/modules/hydroponics/grown).
# SS14-specific chemicals are kept (as production rates) so cooking and grinding still work; Monkestation rates
# override them where the same reagent exists.

- type: plantSpecies
  id: WheatPlants
  name: seeds-wheat-name
  packetPrototype: WheatSeeds
